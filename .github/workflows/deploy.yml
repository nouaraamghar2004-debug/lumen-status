.github/workflows/deploy.yml
name: Déploiement
on:
push:
branches: [main]          
workflow_dispatch:          
permissions:
contents: read
pages: write                
id-token: write             
concurrency:                  
group: pages
cancel-in-progress: false
jobs:
build:
runs-on: ubuntu-latest
steps:- name: Récupérer le code
uses: actions/checkout@v6- name: Installer Python
uses: actions/setup-python@v6
with:
python-version: "3.12"- name: Installer les dépendances
run: pip install -r requirements.txt- name: Tests (garde-fou avant de déployer)
run: pytest -q- name: Générer la page de statut
run: python status/build_page.py- name: Configurer GitHub Pages
uses: actions/configure-pages@v5- name: Déposer l'artefact (dossier public/)
uses: actions/upload-pages-artifact@v4
with:
path: public
deploy:
needs: build              
runs-on: ubuntu-latest
environment:
name: github-pages      
# chaque fusion sur main déclenche un déploiement
# bouton « Run workflow » pour redéployer à la main
# publier sur GitHub Pages
# prouver l'identité du workflow auprès de Pages
# un seul déploiement à la fois
# ne démarre que si build a réussi
# notre production : attend l'approbation
url: ${{ steps.deployment.outputs.page_url }}
steps:- name: Publier sur GitHub Pages
id: deployment
uses: actions/deploy-pages@v4