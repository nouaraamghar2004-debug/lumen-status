# Intégration continue : lance les tests à chaque pull request et à chaque push sur main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:          # bouton « Run workflow » (relance manuelle)

permissions:
  contents: read

jobs:
  tests:                      # nom du job = nom du « check » à exiger dans le ruleset
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -q
